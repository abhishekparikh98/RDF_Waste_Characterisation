[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-waste-characterisation"
version = "0.1.0"
description = "Multi-Modal Waste Characterisation for High-Quality Refuse-Derived Fuel Production Using Machine Learning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "[Your Name]"}]
requires-python = ">=3.9"

[project.urls]
Repository = "[Your GitHub URL]"
Documentation = "[Your Docs URL]"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_mode = 3
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
